<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Табличний фільтр документів</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Бібліотеки для читання PDF, Excel, Word -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>

    <div class="widget">
        <div class="title">Фільтрація прайс-листа</div>
        
        <div class="top-panel">
            <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.docx">
            
            <div id="fileContainer" style="display: none;" class="file-info">
                <span id="fileName"></span>
                <button class="remove-btn" id="removeFile" title="Видалити файл">✕</button>
            </div>
        </div>

        <!-- Чистий фільтр без дурних прикладів -->
        <input type="text" id="filterInput" class="filter-input" placeholder="Введіть запит..." disabled>

        <!-- Структуроване табло результатів (справжня таблиця) -->
        <div id="output" class="output-box">
            <div class="placeholder-text">Завантажте документ і введіть запит для пошуку...</div>
        </div>
    </div>

    <script>
        let priceItems = []; // Масив розібраних рядків прайсу

        document.getElementById('fileInput').addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const extension = file.name.split('.').pop().toLowerCase();
            const outputBox = document.getElementById('output');
            outputBox.innerHTML = '<div class="placeholder-text">Аналіз та структурування документа...</div>';

            try {
                let fullText = "";

                if (extension === 'pdf') {
                    fullText = await readPDF(file);
                } else if (extension === 'xlsx' || extension === 'xls') {
                    fullText = await readExcel(file);
                } else if (extension === 'docx') {
                    fullText = await readWord(file);
                } else {
                    alert('Підтримуються тільки PDF, Excel та Word!');
                    resetWidget();
                    return;
                }

                // Інтелектуально розбираємо документ на структуровані елементи (заголовки + позиції)
                priceItems = parsePriceTable(fullText);

                document.getElementById('fileName').textContent = file.name;
                document.getElementById('fileContainer').style.display = 'flex';
                document.getElementById('fileInput').style.display = 'none';

                const filterInput = document.getElementById('filterInput');
                filterInput.disabled = false;
                filterInput.focus();

                outputBox.innerHTML = `<div class="placeholder-text">Документ готовий. Знайдено позицій: ${priceItems.length}. Введіть запит вище.</div>`;

            } catch (error) {
                console.error(error);
                outputBox.innerHTML = '<div class="placeholder-text" style="color: #ff5252;">Помилка при читанні файлу!</div>';
            }
        });

        async function readPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let text = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                // Акуратно збираємо координати або текст по рядках
                const pageText = textContent.items.map(item => item.str).join(' ');
                text += pageText + "\n";
            }
            return text;
        }

        async function readExcel(file) {
            const arrayBuffer = await file.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            let text = "";
            workbook.SheetNames.forEach(sheetName => {
                const sheet = workbook.Sheets[sheetName];
                text += XLSX.utils.sheet_to_csv(sheet) + "\n";
            });
            return text;
        }

        async function readWord(file) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            return result.value;
        }

        // Жорсткий парсер, який виділяє Назву, Одиницю виміру та Ціну
        function parsePriceTable(text) {
            const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            let items = [];
            let currentCategory = "";

            for (let line of rawLines) {
                // Якщо це заголовок розділу (великими літерами, без цифр)
                if (line === line.toUpperCase() && line.length > 3 && !/\d/.test(line)) {
                    currentCategory = line;
                    continue;
                }

                // Шукаємо в кінці рядка одиницю виміру та ціну (наприклад: "м² 300" або "пог.м. 100,00" або "% 20,00")
                // Регулярка чітко відрікремлює ціну і одиницю від назви роботи
                const match = line.match(/^(.*?)\s+([м²м2%штпог\.]+[\.,]?м?)\s+([\d\s,\.]+)$/i) || 
                              line.match(/^(.*?)\s+([\d\s,\.]+)$/);

                if (match) {
                    if (match.length === 4) {
                        items.push({
                            category: currentCategory,
                            name: match[1].trim(),
                            unit: match[2].trim(),
                            price: match[3].trim()
                        });
                    } else if (match.length === 3) {
                        // Якщо одиниця виміру була злита в назві
                        items.push({
                            category: currentCategory,
                            name: match[1].trim(),
                            unit: "",
                            price: match[2].trim()
                        });
                    }
                } else if (line.length > 5) {
                    // Якщо рядок не має чіткої ціни в кінці, але це текст
                    items.push({
                        category: currentCategory,
                        name: line,
                        unit: "",
                        price: ""
                    });
                }
            }
            return items;
        }

        document.getElementById('removeFile').addEventListener('click', resetWidget);

        function resetWidget() {
            priceItems = [];
            document.getElementById('fileInput').value = '';
            document.getElementById('fileContainer').style.display = 'none';
            document.getElementById('fileInput').style.display = 'inline-block';
            
            const filterInput = document.getElementById('filterInput');
            filterInput.value = '';
            filterInput.disabled = true;

            document.getElementById('output').innerHTML = '<div class="placeholder-text">Завантажте документ і введіть запит для пошуку...</div>';
        }

        // Фільтрація та красиве табличне виведення
        document.getElementById('filterInput').addEventListener('input', function(e) {
            const query = e.target.value.trim().toLowerCase();
            const outputBox = document.getElementById('output');

            if (!query || priceItems.length === 0) {
                outputBox.innerHTML = '<div class="placeholder-text">Завантажте документ і введіть запит для пошуку...</div>';
                return;
            }

            // Шукаємо співпадіння по назві або категорії
            const matched = priceItems.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.category.toLowerCase().includes(query)
            );

            if (matched.length > 0) {
                let htmlContent = '';
                let lastCat = '';

                matched.forEach(item => {
                    // Якщо з'явився розділ — малюємо його гарним заголовком по центру
                    if (item.category && item.category !== lastCat) {
                        lastCat = item.category;
                        htmlContent += `<div class="section-header">${lastCat}</div>`;
                    }

                    // Виводимо повноцінну табличну структуру: Назва | Од. виміру | Ціна
                    htmlContent += `
                        <div class="table-row">
                            <div class="col-name">${item.name}</div>
                            <div class="col-unit">${item.unit}</div>
                            <div class="col-price">${item.price}</div>
                        </div>
                    `;
                });

                outputBox.innerHTML = htmlContent;
            } else {
                outputBox.innerHTML = '<div class="placeholder-text" style="color: #ff5252;">Нічого не знайдено за цим запитом...</div>';
            }
        });
    </script>

</body>
</html>
