<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій віджет</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="widget">
        <div>
            <div class="title">PDF Квадратик-Віджет</div>
            <input type="file" id="fileInput" accept=".txt">
        </div>
        
        <textarea id="output" placeholder="Тут з'являться рядки..."></textarea>
    </div>

    <!-- Весь JavaScript прямо тут, усередині HTML -->
    <script>
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const lines = content.split('\n');
                document.getElementById('output').value = lines.slice(0, 5).join('\n');
            };
            reader.readAsText(file);
        });
    </script>

</body>
</html>
